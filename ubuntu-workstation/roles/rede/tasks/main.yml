---
# Cabo e Wi-Fi ligados na mesma sub-rede: com arp_ignore=0 o kernel responde ARP
# de qualquer IP local por qualquer placa, e o gateway passa a mandar o retorno do
# cabo pelo rádio (ARP flux). Cada placa responde e anuncia só o próprio IP.
- name: ARP por interface (evitar ARP flux com cabo + Wi-Fi na mesma rede)
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-arp-multihome.conf
    reload: true
  loop:
    - { name: net.ipv4.conf.all.arp_ignore, value: "1" }
    - { name: net.ipv4.conf.all.arp_announce, value: "2" }

# Wi-Fi com MAC aleatório (stable-ssid, padrão do Fedora) não casa com a reserva
# DHCP do roteador. "permanent" usa o MAC de fábrica da placa — sem gravar MAC no repo.
# Arquivo em /etc vem depois de /usr/lib/.../conf.d e tem precedência.
- name: Wi-Fi com MAC de fábrica (reserva DHCP casar)
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/90-wifi-mac-permanent.conf
    content: |
      [connection-90-wifi-mac-permanent]
      match-device=type:wifi
      wifi.cloned-mac-address=permanent
    owner: root
    group: root
    mode: "0644"
  notify: Avisar religar Wi-Fi
