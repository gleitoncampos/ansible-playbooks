---
# Chaves GPG e repositórios de terceiros (equivalentes aos .repo do Fedora).
# Usa deb822_repository (idempotente, formato moderno do apt).

- name: Garantir diretório de keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# ---------------- Docker ----------------
- name: Docker | chave GPG
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker | repositório
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    signed_by: /etc/apt/keyrings/docker.asc
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: [amd64]

# ---------------- VS Code (Microsoft) ----------------
- name: VS Code | chave GPG
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /etc/apt/keyrings/microsoft.asc
    mode: "0644"

- name: VS Code | repositório
  ansible.builtin.deb822_repository:
    name: vscode
    types: [deb]
    uris: https://packages.microsoft.com/repos/code
    signed_by: /etc/apt/keyrings/microsoft.asc
    suites: [stable]
    components: [main]
    architectures: [amd64]

# ---------------- GitHub CLI ----------------
- name: GitHub CLI | chave GPG
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli.gpg
    mode: "0644"

- name: GitHub CLI | repositório
  ansible.builtin.deb822_repository:
    name: github-cli
    types: [deb]
    uris: https://cli.github.com/packages
    signed_by: /etc/apt/keyrings/githubcli.gpg
    suites: [stable]
    components: [main]
    architectures: [amd64]

# ---------------- HashiCorp (Terraform) ----------------
- name: HashiCorp | chave GPG
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /etc/apt/keyrings/hashicorp.asc
    mode: "0644"

- name: HashiCorp | repositório
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: [deb]
    uris: https://apt.releases.hashicorp.com
    signed_by: /etc/apt/keyrings/hashicorp.asc
    suites: ["{{ ansible_distribution_release }}"]
    components: [main]
    architectures: [amd64]

# ---------------- Tailscale ----------------
- name: Tailscale | chave GPG
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /etc/apt/keyrings/tailscale.gpg
    mode: "0644"

- name: Tailscale | repositório
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: "https://pkgs.tailscale.com/stable/ubuntu"
    signed_by: /etc/apt/keyrings/tailscale.gpg
    suites: ["{{ ansible_distribution_release }}"]
    components: [main]
    architectures: [amd64]

# ---------------- Cloudflare WARP ----------------
- name: Cloudflare WARP | chave GPG
  ansible.builtin.get_url:
    url: https://pkg.cloudflareclient.com/pubkey.gpg
    dest: /etc/apt/keyrings/cloudflare-warp.asc
    mode: "0644"

- name: Cloudflare WARP | repositório
  ansible.builtin.deb822_repository:
    name: cloudflare-warp
    types: [deb]
    uris: https://pkg.cloudflareclient.com
    signed_by: /etc/apt/keyrings/cloudflare-warp.asc
    suites: ["{{ ansible_distribution_release }}"]
    components: [main]
    architectures: [amd64]

# ---------------- AnyDesk ----------------
- name: AnyDesk | chave GPG
  ansible.builtin.get_url:
    url: https://keys.anydesk.com/repos/DEB-GPG-KEY
    dest: /etc/apt/keyrings/anydesk.asc
    mode: "0644"

- name: AnyDesk | repositório
  ansible.builtin.deb822_repository:
    name: anydesk
    types: [deb]
    uris: http://deb.anydesk.com/
    signed_by: /etc/apt/keyrings/anydesk.asc
    suites: [all]
    components: [main]
    architectures: [amd64]

# ---------------- MongoDB (mongosh + tools) ----------------
- name: MongoDB | chave GPG
  ansible.builtin.get_url:
    url: https://pgp.mongodb.com/server-8.0.asc
    dest: /etc/apt/keyrings/mongodb.asc
    mode: "0644"

- name: MongoDB | repositório
  ansible.builtin.deb822_repository:
    name: mongodb-org
    types: [deb]
    uris: "https://repo.mongodb.org/apt/ubuntu"
    signed_by: /etc/apt/keyrings/mongodb.asc
    suites: ["{{ ansible_distribution_release }}/mongodb-org/8.0"]
    components: [multiverse]
    architectures: [amd64]

- name: Atualizar cache após adicionar repos
  ansible.builtin.apt:
    update_cache: true
