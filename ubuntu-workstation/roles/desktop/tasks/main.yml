---
# Ajustes de desktop KDE Plasma: Num Lock ligado no login e Yakuake no autostart.
# Roda depois da role flatpak (o autostart parte do .desktop exportado pelo flatpak do Yakuake).

# ---------------- Num Lock ----------------
# Tela de login (SDDM): drop-in próprio, sem tocar nos 10-wayland.conf / 20-kubuntu.conf.
- name: Num Lock | diretório de configuração do SDDM
  ansible.builtin.file:
    path: /etc/sddm.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Num Lock | ligado na tela de login (SDDM)
  ansible.builtin.copy:
    dest: /etc/sddm.conf.d/30-numlock.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [General]
      Numlock=on

# Sessão Plasma: NumLock=0 é "ligado" (1 = desligado, 2 = não mexer).
- name: Num Lock | ligado na sessão Plasma
  community.general.ini_file:
    path: "{{ target_home }}/.config/kcminputrc"
    section: Keyboard
    option: NumLock
    value: "0"
    no_extra_spaces: true
    mode: "0644"
  become: true
  become_user: "{{ target_user }}"

# ---------------- Yakuake no autostart ----------------
# Copia o .desktop que o próprio flatpak exporta: o Exec (flatpak run ...) acompanha o flatpak.
- name: Yakuake | diretório de autostart
  ansible.builtin.file:
    path: "{{ target_home }}/.config/autostart"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ target_user }}"

- name: Yakuake | autostart
  ansible.builtin.copy:
    src: /var/lib/flatpak/exports/share/applications/org.kde.yakuake.desktop
    dest: "{{ target_home }}/.config/autostart/org.kde.yakuake.desktop"
    remote_src: true
    mode: "0644"
  become: true
  become_user: "{{ target_user }}"

# ---------------- Orca (AppImage, integrado e gerenciado pelo Gear Lever) ----------------
# Instala só se ausente: versão e sha256 de group_vars valem apenas no primeiro download;
# depois o Gear Lever atualiza. O --integrate COPIA para ~/AppImages/orca.appimage (nome vem do
# Name do .desktop) e apaga o original quando a opção move-appimage-on-integration está ligada
# (padrão). A flag --update-url aparece no --help do --integrate, mas o código não a lê: a fonte
# de atualização é gravada à parte, com --set-update-source (--manager recebe o nome da classe).
# Sem display. O integrate chama `flatpak-spawn --host` (update-desktop-database), que precisa do
# D-Bus de sessão do usuário: por isso XDG_RUNTIME_DIR e DBUS_SESSION_BUS_ADDRESS explícitos.
- name: Orca | uid do usuário alvo
  ansible.builtin.getent:
    database: passwd
    key: "{{ target_user }}"

- name: Orca | checar instalação
  ansible.builtin.stat:
    path: "{{ target_home }}/AppImages/orca.appimage"
  register: desktop_orca_stat
  become: true
  become_user: "{{ target_user }}"

- name: Orca | baixar, integrar e configurar atualização
  when: not desktop_orca_stat.stat.exists
  become: true
  become_user: "{{ target_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][target_user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['getent_passwd'][target_user][1] }}/bus"
  block:
    - name: Orca | diretório temporário do download
      ansible.builtin.file:
        path: "{{ target_home }}/.cache/orca-instalacao"
        state: directory
        mode: "0700"

    - name: Orca | baixar AppImage (sha256 pinado)
      ansible.builtin.get_url:
        url: "https://github.com/stablyai/orca/releases/download/v{{ orca_version }}/orca-linux.AppImage"
        dest: "{{ target_home }}/.cache/orca-instalacao/orca-linux.AppImage"
        checksum: "sha256:{{ orca_sha256 }}"
        mode: "0755"

    - name: Orca | integrar no Gear Lever
      ansible.builtin.command:
        argv:
          - flatpak
          - run
          - it.mijorus.gearlever
          - --integrate
          - "{{ target_home }}/.cache/orca-instalacao/orca-linux.AppImage"
          - -y
        creates: "{{ target_home }}/AppImages/orca.appimage"
      register: desktop_orca_integrar

    # A config é indexada pelo caminho do arquivo já integrado (md5 do caminho).
    - name: Orca | fonte de atualização (GitHub)
      ansible.builtin.command:
        argv:
          - flatpak
          - run
          - it.mijorus.gearlever
          - --set-update-source
          - "{{ target_home }}/AppImages/orca.appimage"
          - --manager
          - GithubUpdater
          - repo=stablyai/orca
          - repo_filename=orca-linux.AppImage
          - allow_prereleases=false
      when: desktop_orca_integrar is not skipped
      changed_when: true

    - name: Orca | remover temporário do download
      ansible.builtin.file:
        path: "{{ target_home }}/.cache/orca-instalacao"
        state: absent

# ---------------- Shell e dotfiles do usuário ----------------
# Arquivos em roles/desktop/files/ (e não content: inline): cópia fiel byte a byte do que roda no
# host, sem escapar `{{`/`$` em ~10 KB de shell, e o shellcheck lê os .sh direto.
- name: Dotfiles | diretórios do usuário
  ansible.builtin.file:
    path: "{{ target_home }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - .bashrc.d
    - .config/vibemix
    - .config/autostart
  become: true
  become_user: "{{ target_user }}"

- name: Dotfiles | copiar arquivos
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ target_home }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: frentes.sh, dest: .bashrc.d/frentes.sh }
    - { src: vimrc, dest: .vimrc }
    - { src: vibemix.sh, dest: .config/vibemix/vibemix.sh }
    - { src: vibemix-watch.sh, dest: .config/vibemix/vibemix-watch.sh }
    - { src: vibe.desktop, dest: .config/autostart/vibe.desktop }
  loop_control:
    label: "{{ item.dest }}"
  become: true
  become_user: "{{ target_user }}"

# Bloco próprio, separado do orca-ajustes; insertbefore mantém o orca-ajustes no fim do arquivo
# (ele precisa vir depois de qualquer reescrita do PS1). Sem o orca-ajustes ainda, cai no fim.
- name: Shell | bloco do ~/.bashrc (bashrc.d, full-update, vibemix, pyenv)
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.bashrc"
    marker: "# {mark} workstation-shell"
    insertbefore: '^# BEGIN orca-ajustes$'
    block: |
      if [ -d ~/.bashrc.d ]; then
          for rc in ~/.bashrc.d/*; do
              if [ -f "$rc" ]; then
                  . "$rc"
              fi
          done
      fi

      # full-update: equivalente Ubuntu do alias do Fedora.
      # Limpa cache do apt, atualiza todos os pacotes apt, flatpak e snap.
      full-update() {
          echo "==> parando packagekit (libera lock do apt/ícone de updates da tray)"
          sudo systemctl stop packagekit 2>/dev/null

          echo "==> apt: limpando cache e atualizando"
          sudo apt clean && \
          sudo apt update && \
          sudo apt full-upgrade -y && \
          sudo apt autoremove -y

          echo "==> flatpak: atualizando"
          flatpak update -y

          echo "==> snap: atualizando"
          sudo snap refresh

          echo "==> full-update concluído"
      }

      # Mix de captura mic + som do sistema (comando: vibemix up|down|status)
      source ~/.config/vibemix/vibemix.sh

      export PYENV_ROOT="$HOME/.pyenv"
      [[ -d $PYENV_ROOT/bin ]] && export PATH="$PYENV_ROOT/bin:$PATH"
      command -v pyenv >/dev/null && eval "$(pyenv init - bash)"
  become: true
  become_user: "{{ target_user }}"

# ---------------- Ajustes de shell para o terminal do Orca ----------------
# O terminal do Orca injeta CLAUDE_CODE_PLUGIN_DIRS; o unset vale porque o wrapper do Orca carrega
# o ~/.bashrc depois. O OSC no fim do PS1 deixa o título da aba só com o nome da pasta (\W).
# O bloco precisa ficar no fim do arquivo, depois de qualquer reescrita do PS1.
- name: Orca | ajustes no ~/.bashrc
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.bashrc"
    marker: "# {mark} orca-ajustes"
    insertafter: EOF
    block: |
      unset CLAUDE_CODE_PLUGIN_DIRS
      PS1="$PS1"'\[\e]0;\W\a\]'
  become: true
  become_user: "{{ target_user }}"

# ---------------- Claude Code: sem título de terminal próprio ----------------
# Define env.CLAUDE_CODE_DISABLE_TERMINAL_TITLE = "1" em ~/.claude/settings.json, preservando as
# demais chaves. Sem `command`/`jq`: o preview (--check --diff) funciona. O conteúdo do arquivo
# fica fora do log e do diff (no_log, diff: false).
- name: Claude Code | checar settings.json
  ansible.builtin.stat:
    path: "{{ target_home }}/.claude/settings.json"
  register: desktop_claude_settings_stat
  become: true
  become_user: "{{ target_user }}"

- name: Claude Code | diretório ~/.claude (instalação limpa)
  ansible.builtin.file:
    path: "{{ target_home }}/.claude"
    state: directory
    mode: "0700"
  when: not desktop_claude_settings_stat.stat.exists
  become: true
  become_user: "{{ target_user }}"

- name: Claude Code | ler settings.json
  ansible.builtin.slurp:
    src: "{{ target_home }}/.claude/settings.json"
  register: desktop_claude_settings_raw
  when: desktop_claude_settings_stat.stat.exists
  no_log: true
  become: true
  become_user: "{{ target_user }}"

- name: Claude Code | interpretar settings.json
  ansible.builtin.set_fact:
    desktop_claude_settings: >-
      {{ (desktop_claude_settings_raw.content | b64decode | from_json)
      if desktop_claude_settings_stat.stat.exists else {} }}
  no_log: true

- name: Claude Code | desligar título de terminal
  ansible.builtin.copy:
    dest: "{{ target_home }}/.claude/settings.json"
    content: "{{ desktop_claude_settings
      | combine({'env': {'CLAUDE_CODE_DISABLE_TERMINAL_TITLE': '1'}}, recursive=True)
      | to_nice_json(indent=2, sort_keys=False, ensure_ascii=False) }}\n"
    mode: "{{ desktop_claude_settings_stat.stat.exists | ternary(omit, '0600') }}"
    backup: true
  when: (desktop_claude_settings.get('env') or {}).get('CLAUDE_CODE_DISABLE_TERMINAL_TITLE', '') != '1'
  diff: false
  no_log: true
  become: true
  become_user: "{{ target_user }}"

# ---------------- Klipper: URL copiada abre no Chromium ----------------
# Só com Plasma: o Klipper é parte do pacote plasma-workspace (o mesmo que traz o plasmashell),
# então /usr/bin/plasmashell presente = Klipper presente. Em máquina sem Plasma as tasks não rodam.
# Só as chaves que diferem do default do Klipper (plasma-workspace 6.6.6, klipper.kcfg):
#   - URLGrabberEnabled: default false;
#   - "Number of Actions" e "Number of commands": o Klipper só carrega Action_N e Command_N se estas
#     contagens existirem (default 0, lidas em urlgrabber.cpp); sem elas a ação inteira é ignorada;
#   - Action_0 e Command_N: não têm default (são todas custom).
# Fora de propósito: StripWhiteSpace=true e ReplayActionInHistory=false são o default (e vivem em
# [Actions], não em [General]); ActionsEnabled e Number não existem no Klipper 6.6.6.
# Regexp usa `.*`: `\S` quebra o KConfig. Seção Action_0 única (duplicada é erro).
# ini_file preserva as demais seções do arquivo. O handler recarrega o Klipper em execução.
- name: Klipper | checar Plasma
  ansible.builtin.stat:
    path: /usr/bin/plasmashell
  register: desktop_plasmashell_stat

- name: Klipper | ação "Abrir URL" no ~/.config/klipperrc
  community.general.ini_file:
    path: "{{ target_home }}/.config/klipperrc"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop:
    - { section: General, option: URLGrabberEnabled, value: "true" }
    - { section: General, option: Number of Actions, value: "1" }
    - { section: Action_0, option: Automatic, value: "true" }
    - { section: Action_0, option: Description, value: Abrir URL }
    - { section: Action_0, option: Number of commands, value: "2" }
    - { section: Action_0, option: Regexp, value: "^https?://.*" }
    - { section: Action_0/Command_0, option: Commandline, value: "/usr/bin/chromium %s" }
    - { section: Action_0/Command_0, option: Description, value: Abrir no Chromium }
    - { section: Action_0/Command_0, option: Enabled, value: "true" }
    - { section: Action_0/Command_0, option: Icon, value: chromium }
    - { section: Action_0/Command_0, option: Output, value: "0" }
    - { section: Action_0/Command_1, option: Commandline, value: "xdg-open %s" }
    - { section: Action_0/Command_1, option: Description, value: Abrir no navegador padrão (Firefox) }
    - { section: Action_0/Command_1, option: Enabled, value: "true" }
    - { section: Action_0/Command_1, option: Output, value: "0" }
  loop_control:
    label: "{{ item.section }} {{ item.option }}"
  when: desktop_plasmashell_stat.stat.exists
  become: true
  become_user: "{{ target_user }}"
  notify: Klipper | recarregar configuração
