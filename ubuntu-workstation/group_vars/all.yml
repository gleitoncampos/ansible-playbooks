---
# Usuário desktop alvo (dono dos flatpaks user, binários em ~/.local/bin, etc.)
target_user: nuvidio
target_home: "/home/{{ target_user }}"

# Versões pinadas de binários baixados direto (atualizar quando quiser bump).
# URLs validadas em 2026-10-09 (HTTP 200/302); Go revalidado em 2026-10-23.
# Go fica na linha 1.26.x (mesma série do Fedora atual); bump só de patch.
go_version: "1.26.10"
flyway_version: "11.8.2"

# .deb de releases do GitHub (mesma versão do Fedora em 2026-10-23).
vibe_version: "3.2.2"
winboat_version: "0.9.2"

# Ferramentas Go instaladas com `go install` no ~/go/bin do usuário (versões do Fedora em 2026-10-23).
go_tools:
  - { name: golangci-lint, pkg: "github.com/golangci/golangci-lint/v2/cmd/golangci-lint", version: "v2.12.2" }
  - { name: gofumpt, pkg: "mvdan.cc/gofumpt", version: "v0.12.0" }
  - { name: gci, pkg: "github.com/daixiang0/gci", version: "v0.14.0" }
  - { name: fieldalignment, pkg: "golang.org/x/tools/go/analysis/passes/fieldalignment/cmd/fieldalignment", version: "v0.52.0" }

# Base do download do Flyway CLI (maven central). O artefato -linux-x64.tar.gz
# existe no maven central até ~11.8.2; versões mais novas podem não publicar lá.
flyway_base_url: "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline"

# Kiro IDE: pacote .deb oficial (Ubuntu). No Ubuntu o caminho suportado é o
# pacote (a doc manda 'apt remove kiro'); o apt resolve dependências e integra
# ao sistema — dispensa o fix de wrapper/symlink que o tarball exigia no Fedora.
# URL/versão validada em 2026-10-09 (HTTP 200). Bump: trocar kiro_ide_version.
kiro_ide_version: "1.2.56"
kiro_ide_base_url: "https://prod.download.desktop.kiro.dev/releases/stable/linux-x64/signed"
kiro_ide_deb_url: "{{ kiro_ide_base_url }}/{{ kiro_ide_version }}/deb/kiro-ide-{{ kiro_ide_version }}-stable-linux-x64.deb"

# Flatpaks (migram 1:1 do Fedora). Trayscale entra aqui (era dnf no Fedora).
flatpak_apps:
  - com.mongodb.Compass
  - com.moonlight_stream.Moonlight
  - com.spotify.Client
  - com.usebottles.bottles
  - io.dbeaver.DBeaverCommunity
  - it.mijorus.gearlever
  - org.ferdium.Ferdium
  - org.kde.yakuake
  - dev.deedles.Trayscale
  - hu.irl.cameractrls

# Apps do apt (universe) + os que vêm de PPA (ver role apt_base).
apt_base_packages:
  - qbittorrent
  - vlc
  - libreoffice
  - solaar
  - git
  - curl
  - wget
  - unzip
  - ca-certificates
  - gnupg
  - apt-transport-https
  - python3-pip
  - pipx
  - obs-studio
  # Ferramentas de trabalho (scan do Fedora em 2026-10-23)
  - ansible-core
  - ansible-lint
  - shellcheck
  - postgresql-client   # psql
  - nodejs
  - npm
  - screen
  - cifs-utils
  - libtss2-rc0t64
  - okular
